        name: id
        schema:
          type: integer
        description: A unique integer value identifying this album.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlbumRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
    delete:
      operationId: v1_catalog_albums_destroy
      description: |-
        Deletes albums and tracks, optionally blocking them with ``?block=true``.

        Blocking keeps a later import from bringing the item back. The audio files are
        removed from disk together with their ``Download`` rows, since a row without its file
        would only mislead the maintenance checks. What was deleted stays in the activity
        log. Deleting an album deletes its tracks.
      parameters:
      - in: query
        name: block
        schema:
          type: boolean
        description: Also block the item.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this album.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalog/albums/{id}/artists/:
