components:
  schemas:
    ActivityLog:
      type: object
      description: One activity history entry.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        username:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        object_type:
          type: string
          description: Returns ``app.model`` of the target.
          readOnly: true
        object_id:
          type: string
          readOnly: true
        detail:
          readOnly: true
      required:
      - action
      - created_at
      - detail
      - id
      - object_id
      - object_type
      - user
      - username
    Album:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        record_type:
          allOf:
          - $ref: '#/components/schemas/RecordTypeEnum'
          readOnly: true
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
          readOnly: true
        ytmusic_id:
          type: string
          readOnly: true
          nullable: true
          description: Browse id.
        track_count:
          type: integer
          readOnly: true
          default: 0
        pending_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - artists
      - id
      - pending_count
      - record_type
      - title
      - track_count
      - ytmusic_id
    AlbumRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - title
    Artist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        description:
          type: string
        ytmusic_id:
          type: string
          readOnly: true
          nullable: true
          description: Channel id.
        monthly_listeners:
          type: integer
          readOnly: true
          nullable: true
        subscribers:
          type: integer
          readOnly: true
          nullable: true
        album_count:
          type: integer
          readOnly: true
          default: 0
        track_count:
          type: integer
          readOnly: true
          default: 0
        pending_count:
          type: integer
          readOnly: true
          default: 0
        suggest_import:
          type: boolean
          readOnly: true
          description: A profile without music whose audience reaches the suggestion
            threshold.
      required:
      - album_count
      - id
      - monthly_listeners
      - name
      - pending_count
      - subscribers
      - suggest_import
      - track_count
      - ytmusic_id
    ArtistIdsRequest:
      type: object
      description: Ordered list of artists; the first one is the main artist.
      properties:
        artists:
          type: array
          items:
            type: integer
      required:
      - artists
    ArtistLookup:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ArtistLookupResult'
      required:
      - results
    ArtistLookupResult:
      type: object
      description: An artist found on YouTube Music.
      properties:
        ytmusic_id:
          type: string
        name:
          type: string
        image_url:
          type: string
          nullable: true
        monthly_listeners:
          type: integer
          nullable: true
        subscribers:
          type: integer
          nullable: true
        album_count:
          type: integer
          nullable: true
          description: Only known when looking up a link or channel id.
        single_count:
          type: integer
          nullable: true
        in_library:
          type: boolean
          description: Already has music in the library.
        blocked:
          type: boolean
      required:
      - album_count
      - blocked
      - image_url
      - in_library
      - monthly_listeners
      - name
      - single_count
      - subscribers
      - ytmusic_id
    ArtistRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        image_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        description:
          type: string
      required:
      - name
    BackupCount:
      type: object
      properties:
        total:
          type: integer
        existing:
          type: integer
          description: Already in the library.
      required:
      - existing
      - total
    BackupPreview:
      type: object
      properties:
        artists:
          $ref: '#/components/schemas/BackupCount'
        albums:
          $ref: '#/components/schemas/BackupCount'
        tracks:
          $ref: '#/components/schemas/BackupCount'
        downloads:
          $ref: '#/components/schemas/BackupCount'
      required:
      - albums
      - artists
      - downloads
      - tracks
    BackupUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: An exported JSON backup.
      required:
      - file
    BlockedItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        external_id:
          type: string
          description: Channel id, browse id or video id, depending on the kind.
          maxLength: 64
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - external_id
      - id
      - kind
    BlockedItemRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        external_id:
          type: string
          minLength: 1
          description: Channel id, browse id or video id, depending on the kind.
          maxLength: 64
        name:
          type: string
          maxLength: 255
      required:
      - external_id
      - kind
    BulkProxyRequest:
      type: object
      description: Pasted proxy list for bulk import.
      properties:
        text:
          type: string
        ip_version:
          allOf:
          - $ref: '#/components/schemas/IpVersionEnum'
          default: ipv4
        enabled:
          type: boolean
          default: true
        default_scheme:
          allOf:
          - $ref: '#/components/schemas/DefaultSchemeEnum'
          default: http
      required:
      - text
    BulkProxyResult:
      type: object
      description: Summary of a bulk import.
      properties:
        created:
          type: integer
        duplicates:
          type: array
          items:
            type: object
            additionalProperties: {}
        invalid:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - created
      - duplicates
      - invalid
    CredentialsRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Credit:
      type: object
      description: One credited artist, in credit order.
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: integer
      required:
      - id
      - name
      - position
    CreditRequest:
      type: object
      description: One credited artist, in credit order.
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
        position:
          type: integer
      required:
      - id
      - name
      - position
    DefaultSchemeEnum:
      enum:
      - http
      - https
      - socks5
      - socks5h
      type: string
      description: |-
        * `http` - http
        * `https` - https
        * `socks5` - socks5
        * `socks5h` - socks5h
    Detail:
      type: object
      description: An error body with a readable message.
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    HistoryEntry:
      type: object
      description: A past version of an item.
      properties:
        history_id:
          type: integer
        history_date:
          type: string
          format: date-time
        history_type:
          type: string
          description: + created, ~ changed, - deleted.
        history_user:
          type: string
          nullable: true
        changes:
          type: object
          additionalProperties: {}
          description: Values of the editable fields.
      required:
      - changes
      - history_date
      - history_id
      - history_type
      - history_user
    IpVersionEnum:
      enum:
      - ipv4
      - ipv6
      type: string
      description: |-
        * `ipv4` - IPv4
        * `ipv6` - IPv6
    JobRun:
      type: object
      description: State and progress of a run, read only.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
        params:
          readOnly: true
          title: Parameters
        user:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/JobRunStatusEnum'
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          title: Started
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Finished
        done:
          type: integer
          readOnly: true
        total:
          type: integer
          readOnly: true
        current:
          type: string
          readOnly: true
          title: Current item
        summary:
          readOnly: true
      required:
      - current
      - done
