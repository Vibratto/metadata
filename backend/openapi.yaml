          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/activity/entries/:
    get:
      operationId: v1_activity_entries_list
      description: 'Activity history. Read only: nobody deletes or edits records.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: user
        schema:
          type: number
      - in: query
        name: username
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
  /api/v1/activity/entries/{id}/:
    get:
      operationId: v1_activity_entries_retrieve
      description: 'Activity history. Read only: nobody deletes or edits records.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activity log.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/v1/activity/logs/:
    get:
      operationId: v1_activity_logs_list
      description: Technical logs stored in the database, administrators only.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: min_level
        schema:
          type: integer
      - in: query
        name: module
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: task
        schema: {}
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTechnicalLogList'
          description: ''
  /api/v1/activity/logs/{id}/:
    get:
      operationId: v1_activity_logs_retrieve
      description: Technical logs stored in the database, administrators only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Logging.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalLog'
          description: ''
  /api/v1/catalog/albums/:
    get:
      operationId: v1_catalog_albums_list
      description: |-
        Deletes albums and tracks, optionally blocking them with ``?block=true``.

        Blocking keeps a later import from bringing the item back. The audio files are
        removed from disk together with their ``Download`` rows, since a row without its file
        would only mislead the maintenance checks. What was deleted stays in the activity
        log. Deleting an album deletes its tracks.
      parameters:
      - in: query
        name: artist
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: download_status
        schema:
          type: string
          enum:
          - complete
          - none
          - partial
        description: |-
          * `complete` - complete
          * `partial` - partial
          * `none` - none
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: record_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      - in: query
        name: year
        schema:
          type: integer
      - in: query
        name: year_from
        schema:
          type: integer
      - in: query
        name: year_to
        schema:
          type: integer
      - in: query
        name: ytmusic_id
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumList'
          description: ''
