      description: 'Log lines after position ``after`` (default: from the start).'
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: Last position already received.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job run.
        required: true
      - in: query
        name: kind
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: started_after
        schema:
          type: string
          format: date-time
      - in: query
        name: started_before
        schema:
          type: string
          format: date-time
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - interrupted
          - pending
          - running
          - stopped
          - stopping
          - succeeded
        description: |-
          * `pending` - pending
          * `running` - running
          * `stopping` - stopping
          * `stopped` - stopped
          * `succeeded` - succeeded
          * `failed` - failed
          * `interrupted` - interrupted
      tags:
      - jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobRunLineList'
          description: ''
